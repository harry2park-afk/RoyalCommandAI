name: Integrated Launch Hardening Evidence

on:
  pull_request:
    branches: [master]
    paths:
      - "supabase/migrations/20260831225500_scope_matter_staff_access.sql"
      - "supabase/migrations/20260904105500_harden_profile_role_authority.sql"
      - "supabase/migrations/20260911045100_room_factory_manifest_acl_hardening.sql"
      - "supabase/candidates/20260924140100_harden_payment_order_authority.sql"
      - ".github/workflows/integrated-launch-hardening-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: rc-integrated-launch-hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrated-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Authenticate GHCR for Supabase image pulls
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Prepare verified-shape disposable launch fixture
        shell: bash
        run: |
          set -euo pipefail
          mv supabase/migrations supabase/migrations-full
          mkdir supabase/migrations
          cp supabase/migrations-full/001_init.sql supabase/migrations/

          cat > supabase/migrations/20260101000000_integrated_launch_fixture.sql <<'SQL'
          alter table public.profiles
            add column if not exists role text not null default 'client',
            add column if not exists ui_preferences jsonb not null default '{}'::jsonb;

          create schema if not exists private;
          revoke all on schema private from public, anon;
          grant usage on schema private to authenticated, service_role;

          alter table public.profiles enable row level security;
          grant all privileges on table public.profiles to anon, authenticated, service_role;

          create table public.matters (
            id uuid primary key default gen_random_uuid(),
            client_id uuid not null references public.profiles(id) on delete cascade,
            service_line text not null check (service_line in ('legal', 'accounting')),
            title text not null,
            summary text not null default '',
            status text not null default 'open'
              check (status in ('draft', 'open', 'in_progress', 'waiting_client', 'waiting_staff', 'closed')),
            assigned_staff_id uuid references public.profiles(id) on delete set null,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now()
          );

          create table public.matter_documents (
            id uuid primary key default gen_random_uuid(),
            matter_id uuid not null references public.matters(id) on delete cascade,
            uploaded_by uuid not null references public.profiles(id) on delete cascade,
            filename text not null,
            mime_type text,
            size_bytes bigint not null default 0,
            category text not null default 'other'
              check (category in ('identity', 'contract', 'tax', 'financial', 'correspondence', 'other')),
            review_status text not null default 'pending'
              check (review_status in ('pending', 'in_review', 'approved', 'needs_changes', 'rejected')),
            review_note text,
            storage_path text,
            created_at timestamptz not null default now()
          );

          create table public.matter_messages (
            id uuid primary key default gen_random_uuid(),
            matter_id uuid not null references public.matters(id) on delete cascade,
            author_id uuid not null references public.profiles(id) on delete cascade,
            body text not null check (char_length(body) between 1 and 8000),
            created_at timestamptz not null default now()
          );

          create table public.matter_chat_reads (
            user_id uuid not null references public.profiles(id) on delete cascade,
            matter_id uuid not null references public.matters(id) on delete cascade,
            last_read_at timestamptz not null default now(),
            primary key (user_id, matter_id)
          );

          alter table public.matters enable row level security;
          alter table public.matter_documents enable row level security;
          alter table public.matter_messages enable row level security;
          alter table public.matter_chat_reads enable row level security;

          grant all privileges on public.matters to anon, authenticated, service_role;
          grant all privileges on public.matter_documents to anon, authenticated, service_role;
          grant all privileges on public.matter_messages to anon, authenticated, service_role;
          grant all privileges on public.matter_chat_reads to anon, authenticated, service_role;

          create or replace function private.is_matter_client(m_id uuid)
          returns boolean
          language sql
          stable
          security definer
          set search_path = public
          as $$
            select exists (
              select 1 from public.matters
              where id = m_id and client_id = auth.uid()
            );
          $$;

          revoke all on function private.is_matter_client(uuid) from public, anon;
          grant execute on function private.is_matter_client(uuid) to authenticated, service_role;

          create policy matters_select_own_or_staff on public.matters
            for select to authenticated using (client_id = auth.uid());
          create policy matters_insert_own on public.matters
            for insert to authenticated with check (client_id = auth.uid());
          create policy matters_update_own_or_staff on public.matters
            for update to authenticated using (client_id = auth.uid()) with check (client_id = auth.uid());

          create policy matter_documents_select on public.matter_documents
            for select to authenticated using (private.is_matter_client(matter_id));
          create policy matter_documents_insert on public.matter_documents
            for insert to authenticated with check (uploaded_by = auth.uid() and private.is_matter_client(matter_id));
          create policy matter_documents_update_staff on public.matter_documents
            for update to authenticated using (false) with check (false);

          create policy matter_messages_select on public.matter_messages
            for select to authenticated using (private.is_matter_client(matter_id));
          create policy matter_messages_insert on public.matter_messages
            for insert to authenticated with check (author_id = auth.uid() and private.is_matter_client(matter_id));

          create policy matter_chat_reads_select on public.matter_chat_reads
            for select to authenticated using (user_id = auth.uid());
          create policy matter_chat_reads_insert on public.matter_chat_reads
            for insert to authenticated with check (user_id = auth.uid() and private.is_matter_client(matter_id));
          create policy matter_chat_reads_update on public.matter_chat_reads
            for update to authenticated using (user_id = auth.uid()) with check (user_id = auth.uid());

          create or replace function private.is_room_member(r_id uuid)
          returns boolean
          language sql
          stable
          security definer
          set search_path = public
          as $$
            select exists (
              select 1
              from public.room_members
              where room_id = r_id
                and user_id = auth.uid()
            );
          $$;

          revoke all on function private.is_room_member(uuid) from public, anon;
          grant execute on function private.is_room_member(uuid) to authenticated, service_role;

          create table public.room_factory_manifests (
            id uuid primary key default gen_random_uuid(),
            room_id uuid not null unique references public.rooms(id) on delete cascade,
            owner_id uuid not null references public.profiles(id) on delete cascade,
            factory_version text not null,
            template_id text not null,
            country_code text not null,
            language_tag text not null,
            country_profile_status text not null
              check (country_profile_status in ('registered', 'custom-profile-required')),
            manifest jsonb not null,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now(),
            check (jsonb_typeof(manifest) = 'object')
          );

          alter table public.room_factory_manifests enable row level security;
          create policy room_factory_manifests_select
            on public.room_factory_manifests
            for select to authenticated
            using (private.is_room_member(room_id));
          create policy room_factory_manifests_insert_owner
            on public.room_factory_manifests
            for insert to authenticated
            with check (
              owner_id = auth.uid()
              and exists (
                select 1 from public.rooms r
                where r.id = room_factory_manifests.room_id
                  and r.room_owner_id = auth.uid()
              )
            );
          grant all privileges on table public.room_factory_manifests
            to anon, authenticated, service_role;

          create table public.rc_service_connection_orders (
            id uuid primary key default gen_random_uuid(),
            owner_id uuid not null,
            service_key text not null default 'evidence-service',
            amount_minor bigint not null default 1000,
            currency text not null default 'AUD',
            terms_version text not null default 'evidence-v1',
            agreed_at timestamptz,
            payment_required boolean not null default true,
            payment_status text not null default 'pending',
            payment_provider text,
            external_checkout_id text,
            external_payment_id text,
            paid_at timestamptz
          );

          alter table public.rc_service_connection_orders enable row level security;
          grant select, insert, update, delete
            on table public.rc_service_connection_orders
            to authenticated;
          grant all on table public.rc_service_connection_orders to service_role;

          create policy rc_service_connection_orders_owner_select
            on public.rc_service_connection_orders
            for select to authenticated
            using (owner_id = auth.uid());
          create policy rc_service_connection_orders_owner_insert_pending
            on public.rc_service_connection_orders
            for insert to authenticated
            with check (
              owner_id = auth.uid()
              and payment_required is true
              and payment_status = 'pending'
              and payment_provider is null
              and external_checkout_id is null
              and external_payment_id is null
              and paid_at is null
            );
          SQL

      - name: Start isolated Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Apply launch hardening set in intended order
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations-full/20260831225500_scope_matter_staff_access.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations-full/20260904105500_harden_profile_role_authority.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations-full/20260911045100_room_factory_manifest_acl_hardening.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/candidates/20260924140100_harden_payment_order_authority.sql

      - name: Prove integrated least-privilege boundaries
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            t text;
          begin
            if not exists (
              select 1 from pg_trigger
              where tgrelid = 'public.profiles'::regclass
                and tgname = 'guard_profile_role_change'
                and not tgisinternal
            ) then
              raise exception 'profile role guard trigger is missing after integrated hardening';
            end if;
            if has_table_privilege('authenticated', 'public.profiles', 'UPDATE')
               or has_column_privilege('authenticated', 'public.profiles', 'role', 'UPDATE') then
              raise exception 'profile authorization boundary regressed';
            end if;
            if not has_column_privilege('authenticated', 'public.profiles', 'full_name', 'UPDATE') then
              raise exception 'ordinary profile self-edit privilege was lost';
            end if;

            if has_table_privilege('authenticated', 'public.matters', 'UPDATE')
               or has_column_privilege('authenticated', 'public.matters', 'client_id', 'UPDATE')
               or has_column_privilege('authenticated', 'public.matters', 'assigned_staff_id', 'UPDATE') then
              raise exception 'Legal Matter protected-column boundary regressed';
            end if;
            if not has_column_privilege('authenticated', 'public.matters', 'title', 'UPDATE') then
              raise exception 'Legal Matter ordinary mutable fields are no longer usable';
            end if;
            foreach t in array array[
              'public.matters',
              'public.matter_documents',
              'public.matter_messages',
              'public.matter_chat_reads'
            ] loop
              if has_table_privilege('anon', t, 'SELECT')
                 or has_table_privilege('anon', t, 'INSERT')
                 or has_table_privilege('anon', t, 'UPDATE')
                 or has_table_privilege('anon', t, 'DELETE') then
                raise exception 'anon Legal Matter privilege remains on %', t;
              end if;
            end loop;

            if not has_table_privilege('authenticated', 'public.room_factory_manifests', 'SELECT')
               or has_table_privilege('authenticated', 'public.room_factory_manifests', 'INSERT')
               or has_table_privilege('authenticated', 'public.room_factory_manifests', 'UPDATE')
               or has_table_privilege('authenticated', 'public.room_factory_manifests', 'DELETE') then
              raise exception 'Room Factory manifest boundary regressed';
            end if;
            if exists (
              select 1 from pg_policies
              where schemaname = 'public'
                and tablename = 'room_factory_manifests'
                and policyname = 'room_factory_manifests_insert_owner'
            ) then
              raise exception 'obsolete Room Factory owner INSERT policy remains';
            end if;
            if not exists (
              select 1 from pg_policies
              where schemaname = 'public'
                and tablename = 'room_factory_manifests'
                and policyname = 'room_factory_manifests_select'
            ) then
              raise exception 'Room Factory member SELECT policy was lost';
            end if;

            if not has_table_privilege('authenticated', 'public.rc_service_connection_orders', 'SELECT')
               or has_table_privilege('authenticated', 'public.rc_service_connection_orders', 'INSERT')
               or has_table_privilege('authenticated', 'public.rc_service_connection_orders', 'UPDATE')
               or has_table_privilege('authenticated', 'public.rc_service_connection_orders', 'DELETE') then
              raise exception 'payment-order authority boundary regressed';
            end if;
            if exists (
              select 1 from pg_policies
              where schemaname = 'public'
                and tablename = 'rc_service_connection_orders'
                and policyname = 'rc_service_connection_orders_owner_insert_pending'
            ) then
              raise exception 'obsolete payment pending-order INSERT policy remains';
            end if;
            if not has_table_privilege('service_role', 'public.rc_service_connection_orders', 'INSERT')
               or not has_table_privilege('service_role', 'public.room_factory_manifests', 'INSERT') then
              raise exception 'trusted service authority was unexpectedly removed';
            end if;
          end;
          $$;
          SQL

      - name: Run integrated authenticated runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"

          USER_EMAIL="integrated-launch-evidence@example.test"
          USER_PASSWORD="IntegratedLaunchEvidence-2026!"
          CREATE_JSON="$(curl --fail-with-body --silent --show-error \
            -X POST "http://127.0.0.1:54321/auth/v1/admin/users" \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data "{\"email\":\"$USER_EMAIL\",\"password\":\"$USER_PASSWORD\",\"email_confirm\":true,\"user_metadata\":{\"full_name\":\"Integrated Evidence User\",\"role\":\"admin\"}}")"
          USER_ID="$(printf '%s' "$CREATE_JSON" | jq -r '.id')"
          test -n "$USER_ID" && test "$USER_ID" != "null"
          test "$(psql "$DB_URL" -Atqc "select role from public.profiles where id = '$USER_ID'::uuid")" = "client"

          LOGIN_JSON="$(curl --fail-with-body --silent --show-error \
            -X POST "http://127.0.0.1:54321/auth/v1/token?grant_type=password" \
            -H "apikey: $ANON_KEY" \
            -H "Content-Type: application/json" \
            --data "{\"email\":\"$USER_EMAIL\",\"password\":\"$USER_PASSWORD\"}")"
          ACCESS_TOKEN="$(printf '%s' "$LOGIN_JSON" | jq -r '.access_token')"
          test -n "$ACCESS_TOKEN" && test "$ACCESS_TOKEN" != "null"

          PROFILE_OK="$(curl --silent --show-error -o /tmp/profile_ok.json -w '%{http_code}' \
            -X PATCH "http://127.0.0.1:54321/rest/v1/profiles?id=eq.$USER_ID" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            --data '{"full_name":"Integrated Allowed Edit"}')"
          test "$PROFILE_OK" = "200"

          PROFILE_BLOCKED="$(curl --silent --show-error -o /tmp/profile_blocked.json -w '%{http_code}' \
            -X PATCH "http://127.0.0.1:54321/rest/v1/profiles?id=eq.$USER_ID" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            --data '{"role":"admin"}')"
          test "$PROFILE_BLOCKED" = "403"

          MATTER_CREATE="$(curl --silent --show-error -o /tmp/matter_create.json -w '%{http_code}' \
            -X POST "http://127.0.0.1:54321/rest/v1/matters" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            --data "{\"client_id\":\"$USER_ID\",\"service_line\":\"legal\",\"title\":\"Integrated Matter\"}")"
          test "$MATTER_CREATE" = "201"

          MATTER_ID="$(jq -r '.[0].id' /tmp/matter_create.json)"
          test -n "$MATTER_ID" && test "$MATTER_ID" != "null"
          MATTER_BLOCKED="$(curl --silent --show-error -o /tmp/matter_blocked.json -w '%{http_code}' \
            -X PATCH "http://127.0.0.1:54321/rest/v1/matters?id=eq.$MATTER_ID" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            --data "{\"client_id\":\"00000000-0000-0000-0000-000000000001\"}")"
          test "$MATTER_BLOCKED" = "403"

          psql "$DB_URL" -v ON_ERROR_STOP=1 -v user_id="$USER_ID" <<'SQL'
          insert into public.households (owner_id, name, household_type)
          values (:'user_id'::uuid, 'Integrated Evidence Household', 'business')
          returning id \gset household_
          insert into public.household_members (household_id, user_id, role)
          values (:'household_id'::uuid, :'user_id'::uuid, 'sovereign');
          insert into public.rooms (household_id, room_owner_id, name)
          values (:'household_id'::uuid, :'user_id'::uuid, 'Integrated Evidence Room')
          returning id \gset room_
          insert into public.room_members (room_id, user_id, role)
          values (:'room_id'::uuid, :'user_id'::uuid, 'owner');
          insert into public.room_factory_manifests (
            room_id, owner_id, factory_version, template_id,
            country_code, language_tag, country_profile_status, manifest
          ) values (
            :'room_id'::uuid, :'user_id'::uuid, 'integrated-v1', 'integrated-template',
            'AU', 'en-AU', 'registered', '{"integrated":true}'::jsonb
          );
          select :'room_id' \g /tmp/integrated_room_id.txt
          SQL
          ROOM_ID="$(awk 'NR==3 {print $1}' /tmp/integrated_room_id.txt)"
          test -n "$ROOM_ID"

          MANIFEST_SELECT="$(curl --silent --show-error -o /tmp/manifest_select.json -w '%{http_code}' \
            -X GET "http://127.0.0.1:54321/rest/v1/room_factory_manifests?room_id=eq.$ROOM_ID&select=room_id,country_code,language_tag" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ACCESS_TOKEN")"
          test "$MANIFEST_SELECT" = "200"
          test "$(jq -r '.[0].language_tag' /tmp/manifest_select.json)" = "en-AU"

          MANIFEST_BLOCKED="$(curl --silent --show-error -o /tmp/manifest_blocked.json -w '%{http_code}' \
            -X POST "http://127.0.0.1:54321/rest/v1/room_factory_manifests" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"room_id\":\"$ROOM_ID\",\"owner_id\":\"$USER_ID\",\"factory_version\":\"bad\",\"template_id\":\"bad\",\"country_code\":\"AU\",\"language_tag\":\"en-AU\",\"country_profile_status\":\"registered\",\"manifest\":{}}")"
          test "$MANIFEST_BLOCKED" = "403"

          PAYMENT_BLOCKED="$(curl --silent --show-error -o /tmp/payment_blocked.json -w '%{http_code}' \
            -X POST "http://127.0.0.1:54321/rest/v1/rc_service_connection_orders" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"owner_id\":\"$USER_ID\",\"service_key\":\"evidence-service\",\"amount_minor\":1000,\"currency\":\"AUD\",\"terms_version\":\"evidence-v1\"}")"
          test "$PAYMENT_BLOCKED" = "403"

      - name: Stop isolated Supabase stack
        if: always()
        run: supabase stop --no-backup
