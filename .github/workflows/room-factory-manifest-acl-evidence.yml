name: Room Factory Manifest ACL Evidence

on:
  pull_request:
    branches: [master]
    paths:
      - "supabase/migrations/20260901025800_room_factory_atomic_non_encounter.sql"
      - "supabase/migrations/20260911045100_room_factory_manifest_acl_hardening.sql"
      - "scripts/room-factory-schema-stage-evidence.mjs"
      - ".github/workflows/room-factory-manifest-acl-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc-room-factory-manifest-acl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest-acl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact candidate head
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          [[ "${actual_sha}" == "${CANDIDATE_SHA}" ]] || {
            echo "BLOCKED: checkout SHA ${actual_sha} does not match candidate ${CANDIDATE_SHA}"
            exit 1
          }
          echo "VERIFIED_EXACT_CANDIDATE_SHA ${actual_sha}"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.116.0

      - name: Prepare isolated Room Factory schema fixture
        shell: bash
        run: |
          set -euo pipefail
          mv supabase/migrations supabase/migrations-full
          mkdir supabase/migrations
          cp supabase/migrations-full/001_init.sql supabase/migrations/
          cp supabase/migrations-full/002_rls.sql supabase/migrations/
          cp supabase/migrations-full/20260829211500_room_factory_manifests.sql supabase/migrations/
          cp supabase/migrations-full/20260831084700_atomic_room_factory_encounter_creation.sql supabase/migrations/
          cp supabase/migrations-full/20260901022500_harden_room_factory_atomic_invoker.sql supabase/migrations/
          cp supabase/migrations-full/20260901025800_room_factory_atomic_non_encounter.sql supabase/migrations/
          cp supabase/migrations-full/20260911045100_room_factory_manifest_acl_hardening.sql supabase/migrations/

          cat > supabase/roles.sql <<'SQL'
          create schema if not exists private;

          create or replace function private.is_room_member(r_id uuid)
          returns boolean
          language plpgsql
          stable
          security definer
          set search_path = public
          as $$
          begin
            return exists (
              select 1 from public.room_members
              where room_id = r_id and user_id = auth.uid()
            );
          end;
          $$;
          SQL

      - name: Start disposable Supabase
        run: supabase start

      - name: Prove manifest ACL is fail-closed
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_rls_enabled boolean;
            v_insert_policy_count integer;
          begin
            select c.relrowsecurity
              into v_rls_enabled
            from pg_class c
            join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public'
              and c.relname = 'room_factory_manifests';

            if v_rls_enabled is distinct from true then
              raise exception 'room_factory_manifests RLS is not enabled';
            end if;

            if has_table_privilege('anon', 'public.room_factory_manifests', 'SELECT')
               or has_table_privilege('anon', 'public.room_factory_manifests', 'INSERT')
               or has_table_privilege('anon', 'public.room_factory_manifests', 'UPDATE')
               or has_table_privilege('anon', 'public.room_factory_manifests', 'DELETE')
               or has_table_privilege('anon', 'public.room_factory_manifests', 'TRUNCATE')
               or has_table_privilege('anon', 'public.room_factory_manifests', 'REFERENCES')
               or has_table_privilege('anon', 'public.room_factory_manifests', 'TRIGGER') then
              raise exception 'anonymous manifest-table privilege remains';
            end if;

            if not has_table_privilege('authenticated', 'public.room_factory_manifests', 'SELECT') then
              raise exception 'authenticated member-read privilege missing';
            end if;

            if has_table_privilege('authenticated', 'public.room_factory_manifests', 'INSERT')
               or has_table_privilege('authenticated', 'public.room_factory_manifests', 'UPDATE')
               or has_table_privilege('authenticated', 'public.room_factory_manifests', 'DELETE')
               or has_table_privilege('authenticated', 'public.room_factory_manifests', 'TRUNCATE')
               or has_table_privilege('authenticated', 'public.room_factory_manifests', 'REFERENCES')
               or has_table_privilege('authenticated', 'public.room_factory_manifests', 'TRIGGER') then
              raise exception 'authenticated direct manifest mutation/control privilege remains';
            end if;

            select count(*)
              into v_insert_policy_count
            from pg_policies
            where schemaname = 'public'
              and tablename = 'room_factory_manifests'
              and cmd = 'INSERT'
              and 'authenticated' = any(roles);

            if v_insert_policy_count <> 0 then
              raise exception 'authenticated direct manifest INSERT policy remains';
            end if;

            if not has_function_privilege(
              'authenticated',
              'public.create_room_factory_room_atomic(uuid,uuid,text,text,text,text,text,text,text,text,text,jsonb)',
              'EXECUTE'
            ) then
              raise exception 'authenticated atomic Room Factory entrypoint missing';
            end if;
          end;
          $$;
          SQL

      - name: Prove atomic Room Factory still creates manifests
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export RC_SCHEMA_STAGE_SUPABASE_URL="http://127.0.0.1:54321"
          export RC_SCHEMA_STAGE_ANON_KEY="$ANON_KEY"
          export RC_SCHEMA_STAGE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export RC_SCHEMA_STAGE_TEST_EMAIL="rc-manifest-acl-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.test"
          export RC_SCHEMA_STAGE_TEST_PASSWORD="RC-Manifest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-Aa1!"
          export RC_SCHEMA_STAGE_ALLOW_LOCALHOST=1
          export RC_SCHEMA_STAGE_VERIFY_MANIFEST_ACL=1
          node scripts/room-factory-schema-stage-evidence.mjs

      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
