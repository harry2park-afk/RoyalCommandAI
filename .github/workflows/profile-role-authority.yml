name: Profile Role Authority Evidence

on:
  pull_request:
    branches: [master]
    paths:
      - "supabase/migrations/20260904105500_harden_profile_role_authority.sql"
      - "scripts/profile-role-authority-evidence.mjs"
      - ".github/workflows/profile-role-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc-profile-role-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-role-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact candidate head
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          [[ "${actual_sha}" == "${CANDIDATE_SHA}" ]] || {
            echo "BLOCKED: checkout SHA ${actual_sha} does not match candidate ${CANDIDATE_SHA}"
            exit 1
          }
          echo "VERIFIED_EXACT_CANDIDATE_SHA ${actual_sha}"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.116.0

      - name: Assemble disposable recovery replay
        shell: bash
        run: |
          set -euo pipefail
          # Match the repository's already-green clean-replay harness. Historical
          # migrations stay untouched; recovery prerequisites exist only in this
          # disposable runner and no Hosted credentials are used.
          mv supabase/migrations supabase/migrations-full
          mkdir supabase/migrations

          cp supabase/migrations-full/001_init.sql supabase/migrations/001_init.sql
          cp supabase/migrations-full/002_rls.sql supabase/migrations/002_rls.sql
          cp supabase/recovery/20260901_prelaunch_baseline.sql \
             supabase/migrations/003_recovery_prelaunch_baseline.sql
          cp supabase/recovery/20260901_communications_foundation.sql \
             supabase/migrations/004_recovery_communications_foundation.sql

          find supabase/migrations-full -maxdepth 1 -type f -name '*.sql' \
            ! -name '001_init.sql' \
            ! -name '002_rls.sql' \
            -print0 | sort -z | xargs -0 -I{} cp '{}' supabase/migrations/

      - name: Start disposable Supabase with full migration chain
        run: supabase start

      - name: Prove role authority boundary
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export RC_PROFILE_ROLE_SUPABASE_URL="http://127.0.0.1:54321"
          export RC_PROFILE_ROLE_ANON_KEY="$ANON_KEY"
          export RC_PROFILE_ROLE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export RC_PROFILE_ROLE_TEST_SUFFIX="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export RC_PROFILE_ROLE_TEST_PASSWORD="RC-Role-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-Aa1!"
          export RC_PROFILE_ROLE_ALLOW_LOCALHOST=1
          node scripts/profile-role-authority-evidence.mjs

      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
