name: Phase 1 Task 1 Lock Sync

on:
  push:
    branches:
      - phase1/task1-lock-sync

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Regenerate package lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify npm ci against regenerated lock
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit lock if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "royal-command-ci"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(phase1): synchronize package lock"
          git push origin HEAD:phase1/task1-lock-sync
