name: Royal Command Quality Gate

on:
  pull_request:
  push:
    branches: [master, feat/independent-ai-rooms-v1-20260906, 'work/**', 'rc-work/**']

permissions:
  contents: read

concurrency:
  group: rc-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Royal Command Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Lint RC V3 and changed code
        run: |
          npx eslint src/app/rcv3 src/app/api/rcv3 src/lib/rcv3 src/components/rcv3-toolbox rcv3/tool-registry.mjs
          node scripts/quality-gate-lint.mjs

      - name: Verify changed-file selection
        run: node --test scripts/quality-gate-lint.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --passWithNoTests

      - name: Production build
        run: npm run build
