name: Royal Command Quality Gate

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: rc-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Lint changed code
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mapfile -t files < <(git diff --name-only --diff-filter=ACMR origin/master...HEAD -- '*.js' '*.jsx' '*.ts' '*.tsx')
          else
            mapfile -t files < <(git diff --name-only --diff-filter=ACMR HEAD^ HEAD -- '*.js' '*.jsx' '*.ts' '*.tsx')
          fi
          if [ ${#files[@]} -eq 0 ]; then
            echo "No changed JS/TS files to lint."
          else
            printf 'Linting changed files:\n%s\n' "${files[*]}"
            npx eslint "${files[@]}"
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --passWithNoTests

      - name: Production build
        run: npm run build
