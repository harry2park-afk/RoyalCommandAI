name: Royal Command Conflict Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  conflict-guard:
    name: conflict
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove fail-closed behavior
        run: node scripts/conflict-guard-selftest.mjs

      - name: Scan for ownership conflicts
        env:
          CONFLICT_GUARD_BASE: ${{ github.event.pull_request.base.sha }}
          CONFLICT_GUARD_HEAD: ${{ github.event.pull_request.head.sha }}
          CONFLICT_GUARD_STRICT: "1"
        run: node scripts/conflict-guard.mjs

      - name: Confirm enforcing mode
        run: |
          echo "Conflict Guard v2 is ENFORCING."
          echo "Detected duplicate ownership or scanner failure blocks this PR check."
