name: Room Factory Concurrency Evidence

on:
  pull_request:
    branches: [master]
    paths:
      - "src/app/api/room-factory/rooms/route.ts"
      - "supabase/migrations/**"
      - "scripts/room-factory-concurrency-evidence.mjs"
      - ".github/workflows/room-factory-concurrency.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc-room-factory-concurrency-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Bootstrap production-equivalent private helpers for isolated replay
        shell: bash
        run: |
          set -euo pipefail
          # Production has these helpers from an older migration lineage that is
          # not present in the checked-in clean-replay chain. This roles.sql is
          # generated only on the disposable CI runner. It is never applied to a
          # hosted project and is not a substitute for reconciling migration drift.
          cat > supabase/roles.sql <<'SQL'
          create schema if not exists private;

          create or replace function private.is_room_member(r_id uuid)
          returns boolean
          language plpgsql
          stable
          security definer
          set search_path = public
          as $$
          begin
            return exists (
              select 1 from public.room_members
              where room_id = r_id and user_id = auth.uid()
            );
          end;
          $$;

          create or replace function private.is_household_member(h_id uuid)
          returns boolean
          language plpgsql
          stable
          security definer
          set search_path = public
          as $$
          begin
            return exists (
              select 1 from public.household_members
              where household_id = h_id and user_id = auth.uid()
            );
          end;
          $$;

          create or replace function private.is_matter_client(m_id uuid)
          returns boolean
          language plpgsql
          stable
          security definer
          set search_path = public
          as $$
          begin
            return exists (
              select 1 from public.matters
              where id = m_id and client_id = auth.uid()
            );
          end;
          $$;

          create or replace function private.is_staff_or_admin()
          returns boolean
          language plpgsql
          stable
          security definer
          set search_path = public
          as $$
          begin
            return exists (
              select 1 from public.profiles
              where id = auth.uid() and role in ('staff', 'admin')
            );
          end;
          $$;
          SQL

      - name: Start isolated Supabase stack
        run: supabase start

      - name: Prove same-owner same-encounter concurrency
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export RC_CONCURRENCY_SUPABASE_URL="http://127.0.0.1:54321"
          export RC_CONCURRENCY_ANON_KEY="$ANON_KEY"
          export RC_CONCURRENCY_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export RC_CONCURRENCY_TEST_EMAIL="rc-concurrency-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.test"
          export RC_CONCURRENCY_TEST_PASSWORD="RC-Local-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-Aa1!"
          export RC_CONCURRENCY_ALLOW_LOCALHOST=1
          node scripts/room-factory-concurrency-evidence.mjs

      - name: Stop isolated Supabase stack
        if: always()
        run: supabase stop --no-backup
