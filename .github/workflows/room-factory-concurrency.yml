name: Room Factory Concurrency Evidence

on:
  pull_request:
    branches: [master]
    paths:
      - "src/app/api/room-factory/rooms/route.ts"
      - "src/app/api/room-factory/rooms/route.test.ts"
      - "supabase/migrations/**"
      - "scripts/room-factory-concurrency-evidence.mjs"
      - "scripts/room-factory-route-smoke.mjs"
      - ".github/workflows/room-factory-concurrency.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc-room-factory-concurrency-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Prepare minimal Room Factory migration fixture
        shell: bash
        run: |
          set -euo pipefail
          # Keep this targeted evidence fixture small. Full repository replay is
          # independently enforced by Supabase Clean Replay Evidence.
          mv supabase/migrations supabase/migrations-full
          mkdir supabase/migrations
          cp supabase/migrations-full/001_init.sql supabase/migrations/
          cp supabase/migrations-full/002_rls.sql supabase/migrations/
          cp supabase/migrations-full/20260829211500_room_factory_manifests.sql supabase/migrations/
          cp supabase/migrations-full/20260831084700_atomic_room_factory_encounter_creation.sql supabase/migrations/
          cp supabase/migrations-full/20260901022500_harden_room_factory_atomic_invoker.sql supabase/migrations/

          # Production has private.is_room_member from the canonical recovered
          # lineage. Match that helper only for this focused disposable fixture;
          # the full clean-replay workflow proves the repository recovery chain.
          cat > supabase/roles.sql <<'SQL'
          create schema if not exists private;

          create or replace function private.is_room_member(r_id uuid)
          returns boolean
          language plpgsql
          stable
          security definer
          set search_path = public
          as $$
          begin
            return exists (
              select 1 from public.room_members
              where room_id = r_id and user_id = auth.uid()
            );
          end;
          $$;
          SQL

      - name: Start isolated Supabase stack
        run: supabase start

      - name: Prove public invoker and internal privilege boundary
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_public_security_definer boolean;
            v_internal_security_definer boolean;
          begin
            if has_function_privilege('authenticated', 'private.create_room_factory_room_atomic(uuid,uuid,text,text,text,text,text,text,text,text,text,jsonb)', 'EXECUTE') then
              raise exception 'authenticated must not execute original private Room Factory implementation';
            end if;
            if has_function_privilege('anon', 'private.create_room_factory_room_atomic(uuid,uuid,text,text,text,text,text,text,text,text,text,jsonb)', 'EXECUTE') then
              raise exception 'anon must not execute original private Room Factory implementation';
            end if;
            if has_function_privilege('service_role', 'private.create_room_factory_room_atomic(uuid,uuid,text,text,text,text,text,text,text,text,text,jsonb)', 'EXECUTE') then
              raise exception 'service_role must not execute original private Room Factory implementation directly';
            end if;

            if not has_schema_privilege('authenticated', 'room_factory_internal', 'USAGE') then
              raise exception 'authenticated must have USAGE only on dedicated Room Factory internal schema';
            end if;
            if has_schema_privilege('anon', 'room_factory_internal', 'USAGE') then
              raise exception 'anon must not have USAGE on Room Factory internal schema';
            end if;
            if has_schema_privilege('service_role', 'room_factory_internal', 'USAGE') then
              raise exception 'service_role must not have USAGE on Room Factory internal schema';
            end if;

            if not has_function_privilege('authenticated', 'room_factory_internal.create_room_factory_room_atomic(uuid,uuid,text,text,text,text,text,text,text,text,text,jsonb)', 'EXECUTE') then
              raise exception 'authenticated must execute the dedicated internal bridge through the public wrapper';
            end if;
            if has_function_privilege('anon', 'room_factory_internal.create_room_factory_room_atomic(uuid,uuid,text,text,text,text,text,text,text,text,text,jsonb)', 'EXECUTE') then
              raise exception 'anon must not execute Room Factory internal bridge';
            end if;
            if has_function_privilege('service_role', 'room_factory_internal.create_room_factory_room_atomic(uuid,uuid,text,text,text,text,text,text,text,text,text,jsonb)', 'EXECUTE') then
              raise exception 'service_role must not execute Room Factory internal bridge';
            end if;

            if not has_function_privilege('authenticated', 'public.create_room_factory_room_atomic(uuid,uuid,text,text,text,text,text,text,text,text,text,jsonb)', 'EXECUTE') then
              raise exception 'authenticated must execute public Room Factory entrypoint';
            end if;
            if has_function_privilege('service_role', 'public.create_room_factory_room_atomic(uuid,uuid,text,text,text,text,text,text,text,text,text,jsonb)', 'EXECUTE') then
              raise exception 'service_role must not execute public Room Factory entrypoint';
            end if;
            if has_function_privilege('anon', 'public.create_room_factory_room_atomic(uuid,uuid,text,text,text,text,text,text,text,text,text,jsonb)', 'EXECUTE') then
              raise exception 'anon must not execute public Room Factory entrypoint';
            end if;

            select p.prosecdef
            into v_public_security_definer
            from pg_proc p
            join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public'
              and p.oid = 'public.create_room_factory_room_atomic(uuid,uuid,text,text,text,text,text,text,text,text,text,jsonb)'::regprocedure;

            select p.prosecdef
            into v_internal_security_definer
            from pg_proc p
            join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'room_factory_internal'
              and p.oid = 'room_factory_internal.create_room_factory_room_atomic(uuid,uuid,text,text,text,text,text,text,text,text,text,jsonb)'::regprocedure;

            if v_public_security_definer is distinct from false then
              raise exception 'public Room Factory entrypoint must be SECURITY INVOKER';
            end if;
            if v_internal_security_definer is distinct from true then
              raise exception 'internal Room Factory bridge must be SECURITY DEFINER';
            end if;
          end;
          $$;
          SQL

      - name: Prove internal schema is not exposed by Data API
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          status="$(curl -sS -o /tmp/rc-internal-schema-probe.txt -w '%{http_code}' \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "Accept-Profile: room_factory_internal" \
            "http://127.0.0.1:54321/rest/v1/")"
          cat /tmp/rc-internal-schema-probe.txt
          if [ "$status" = "200" ]; then
            echo "::error::room_factory_internal unexpectedly exposed through PostgREST"
            exit 1
          fi
          if ! grep -Eqi 'schema|profile' /tmp/rc-internal-schema-probe.txt; then
            echo "::error::PostgREST rejection did not identify a schema/profile boundary"
            exit 1
          fi

      - name: Install local-only rollback fault injection
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create or replace function public.rc_test_force_room_factory_manifest_failure()
          returns trigger
          language plpgsql
          as $$
          begin
            if coalesce(new.manifest->>'forceRollback', 'false') = 'true' then
              raise exception 'RC_TEST_FORCED_MANIFEST_FAILURE';
            end if;
            return new;
          end;
          $$;

          create trigger rc_test_force_room_factory_manifest_failure
          before insert on public.room_factory_manifests
          for each row execute function public.rc_test_force_room_factory_manifest_failure();
          SQL

      - name: Prove rollback and same-owner same-encounter concurrency
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export RC_CONCURRENCY_SUPABASE_URL="http://127.0.0.1:54321"
          export RC_CONCURRENCY_ANON_KEY="$ANON_KEY"
          export RC_CONCURRENCY_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export RC_CONCURRENCY_TEST_EMAIL="rc-concurrency-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.test"
          export RC_CONCURRENCY_TEST_PASSWORD="RC-Local-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-Aa1!"
          export RC_CONCURRENCY_ALLOW_LOCALHOST=1
          export RC_CONCURRENCY_FORCE_ROLLBACK_TEST=1
          node scripts/room-factory-concurrency-evidence.mjs

      - name: Start isolated Room Factory route candidate
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="http://127.0.0.1:54321"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          nohup npm run dev -- --hostname 127.0.0.1 --port 3000 >/tmp/rc-route-smoke-next.log 2>&1 &
          echo $! >/tmp/rc-route-smoke-next.pid

          for attempt in $(seq 1 60); do
            if curl -sS -o /dev/null "http://127.0.0.1:3000/api/room-factory/rooms"; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/rc-route-smoke-next.log
          echo "::error::Next.js route candidate did not become reachable"
          exit 1

      - name: Prove authenticated Room Factory route cutover
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export RC_ROUTE_SMOKE_SUPABASE_URL="http://127.0.0.1:54321"
          export RC_ROUTE_SMOKE_ANON_KEY="$ANON_KEY"
          export RC_ROUTE_SMOKE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export RC_ROUTE_SMOKE_APP_URL="http://127.0.0.1:3000"
          export RC_ROUTE_SMOKE_TEST_EMAIL="rc-route-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.test"
          export RC_ROUTE_SMOKE_TEST_PASSWORD="RC-Route-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-Aa1!"
          export RC_ROUTE_SMOKE_ALLOW_LOCALHOST=1
          node scripts/room-factory-route-smoke.mjs

      - name: Stop isolated Room Factory route candidate
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/rc-route-smoke-next.pid ]; then
            kill "$(cat /tmp/rc-route-smoke-next.pid)" 2>/dev/null || true
          fi
          pkill -f "next dev.*127.0.0.1.*3000" 2>/dev/null || true

      - name: Stop isolated Supabase stack
        if: always()
        run: supabase stop --no-backup
