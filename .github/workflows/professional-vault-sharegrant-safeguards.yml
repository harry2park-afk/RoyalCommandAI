name: Professional Vault ShareGrant Safeguards

on:
  pull_request:
    branches: [master]
    paths:
      - "supabase/migrations/20260910155500_professional_vault_sharegrant_foundation.sql"
      - "scripts/professional-vault-sharegrant-safeguards.sql"
      - ".github/workflows/professional-vault-sharegrant-safeguards.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc-professional-vault-sharegrant-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vault-sharegrant-safeguards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact candidate head
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          [[ "${actual_sha}" == "${CANDIDATE_SHA}" ]] || {
            echo "BLOCKED: checkout SHA ${actual_sha} does not match candidate ${CANDIDATE_SHA}"
            exit 1
          }
          echo "VERIFIED_EXACT_CANDIDATE_SHA ${actual_sha}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.116.0

      - name: Assemble disposable recovery replay
        shell: bash
        run: |
          set -euo pipefail
          mv supabase/migrations supabase/migrations-full
          mkdir supabase/migrations

          cp supabase/migrations-full/001_init.sql supabase/migrations/001_init.sql
          cp supabase/migrations-full/002_rls.sql supabase/migrations/002_rls.sql
          cp supabase/recovery/20260901_prelaunch_baseline.sql \
             supabase/migrations/003_recovery_prelaunch_baseline.sql
          cp supabase/recovery/20260901_communications_foundation.sql \
             supabase/migrations/004_recovery_communications_foundation.sql

          find supabase/migrations-full -maxdepth 1 -type f -name '*.sql' \
            ! -name '001_init.sql' \
            ! -name '002_rls.sql' \
            -print0 | sort -z | xargs -0 -I{} cp '{}' supabase/migrations/

      - name: Start blank Supabase and replay repository chain
        run: supabase start

      - name: Verify Professional Vault ShareGrant boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/professional-vault-sharegrant
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 \
            -f scripts/professional-vault-sharegrant-safeguards.sql \
            2>&1 | tee artifacts/professional-vault-sharegrant/safeguards.log

      - name: Upload disposable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: professional-vault-sharegrant-${{ env.CANDIDATE_SHA }}
          path: artifacts/professional-vault-sharegrant/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup
