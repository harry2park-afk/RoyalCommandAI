name: RC Work PR

on:
  push:
    branches:
      - 'rc-work/**'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  ensure-work-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create Work Queue ticket and PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/', '');
            if (!branch.startsWith('rc-work/')) {
              core.setFailed(`Unexpected branch: ${branch}`);
              return;
            }

            const parts = branch.split('/');
            const workSegment = parts[1] || 'rc-work';
            const providerSegment = parts[2] || 'unknown-provider';
            const providerId = providerSegment.split('-')[0].toLowerCase();
            const providerNames = {
              openai: 'ChatGPT',
              anthropic: 'Claude',
              google: 'Gemini',
              xai: 'Grok',
              codex: 'Codex',
              gateway: 'Tool Gateway',
            };
            const providerName = providerNames[providerId] || providerId;
            const workId = workSegment.toUpperCase();
            const base = 'master';

            const existingPRs = await github.rest.pulls.list({ owner, repo, head: `${owner}:${branch}`, base, state: 'open', per_page: 10 });
            if (existingPRs.data.length) {
              core.info(`PR already exists: #${existingPRs.data[0].number}`);
              return;
            }

            const issues = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const ticketTitle = `[${workId}] RC Work Queue`;
            let ticket = issues.data.find((item) => !item.pull_request && item.title === ticketTitle);
            if (!ticket) {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title: ticketTitle,
                body: [
                  `Work ID: ${workId}`,
                  `Provider: ${providerName} (${providerId})`,
                  `Work branch: ${branch}`,
                  '',
                  'Created automatically by the Royal Command RC Work PR workflow.',
                  'Keep this issue open until all corresponding provider work is merged or rejected.',
                ].join('\n'),
              });
              ticket = created.data;
            }

            const baseRef = await github.rest.git.getRef({ owner, repo, ref: `heads/${base}` });
            const compare = await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `${base}...${branch}` });
            const changedFiles = (compare.data.files || []).map((file) => `- ${file.filename}`).join('\n') || '- Provider-generated files on this branch';

            const body = [
              '## Work Queue Ticket',
              `#${ticket.number}`,
              '',
              '## Primary task',
              `Execute Royal Command work ${workId} with ${providerName}.`,
              '',
              '## Batch exception',
              'NO — one provider work item only.',
              '',
              '## Goal',
              `Apply the host-verified ${providerName} change for ${workId} on a safe provider branch without direct master writes.`,
              '',
              '## Files / components changed',
              changedFiles,
              '',
              '## Locked surfaces touched',
              'NONE unless explicitly listed in the changed files and authorized by the originating user order.',
              '',
              '## Explicit non-goals',
              'Do not merge to production automatically, do not modify unrelated files, and do not bypass Royal Command approval gates.',
              '',
              '## Verification plan',
              'Run repository automated checks and Vercel Preview before any production merge.',
              '',
              '## Automated checks',
              'GitHub Actions quality, conflict, and change-control workflows must pass.',
              '',
              '## Vercel Preview',
              'Required before production approval; Vercel Git integration will create the Preview deployment for this PR.',
              '',
              '## Rollback point',
              `Baseline master commit: ${baseRef.data.object.sha}`,
            ].join('\n');

            const pr = await github.rest.pulls.create({
              owner,
              repo,
              head: branch,
              base,
              title: `[${workId}][${providerName}] Royal Command work`,
              body,
              draft: false,
            });
            core.info(`Created PR #${pr.data.number}`);
