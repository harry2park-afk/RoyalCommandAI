name: Fix Builder Typecheck

on:
  push:
    branches:
      - fix/builder-live-e2e-hardening-20260825

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix Builder typecheck'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/builder-live-e2e-hardening-20260825
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply Builder typecheck fixes
        run: node scripts/fix-builder-typecheck.mjs

      - name: Verify Builder lint and typecheck
        run: |
          npx eslint src/app/api/builder/route.ts
          npm run typecheck

      - name: Remove one-time fixer and restore lockfile
        run: |
          rm scripts/fix-builder-typecheck.mjs
          rm .github/workflows/fix-builder-typecheck.yml
          git checkout -- package-lock.json

      - name: Commit type-safe Builder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Builder typecheck"
          git push origin HEAD:fix/builder-live-e2e-hardening-20260825
