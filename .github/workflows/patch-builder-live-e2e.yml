name: Patch Builder Live E2E

on:
  push:
    branches:
      - fix/builder-live-e2e-hardening-20260825

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply Builder E2E hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/builder-live-e2e-hardening-20260825
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Apply targeted Builder patch
        run: node scripts/patch-builder-live-e2e.mjs

      - name: Remove one-time patch machinery
        run: |
          rm scripts/patch-builder-live-e2e.mjs
          rm .github/workflows/patch-builder-live-e2e.yml

      - name: Commit hardened Builder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/builder/route.ts .github/workflows/rc-builder-pr.yml scripts/patch-builder-live-e2e.mjs .github/workflows/patch-builder-live-e2e.yml
          git commit -m "Apply Builder E2E hardening"
          git push origin HEAD:fix/builder-live-e2e-hardening-20260825
