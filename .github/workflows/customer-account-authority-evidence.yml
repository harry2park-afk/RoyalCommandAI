name: Customer Account Authority Evidence

on:
  pull_request:
    branches: [master]
    paths:
      - "scripts/supabase-customer-account-remediation-candidate.sql"
      - ".github/workflows/customer-account-authority-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc-customer-account-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Prepare verified-shape disposable customer-account fixture
        shell: bash
        run: |
          set -euo pipefail
          mv supabase/migrations supabase/migrations-full
          mkdir supabase/migrations

          cat > supabase/migrations/20260101000000_customer_account_authority_fixture.sql <<'SQL'
          create sequence public.rc_customer_number_seq
            as bigint
            start with 357071
            increment by 1
            minvalue 1
            no maxvalue
            no cycle;

          create table public.rc_customer_accounts (
            owner_id uuid primary key references auth.users(id) on delete cascade,
            customer_number text not null unique
              check (customer_number ~ '^RC [0-9]{7}$'::text),
            customer_sequence bigint not null unique
              check (customer_sequence >= 357060),
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now()
          );

          alter table public.rc_customer_accounts enable row level security;

          create policy rc_customer_accounts_read_own
            on public.rc_customer_accounts
            for select
            to authenticated
            using (owner_id = auth.uid());

          -- Reproduce the verified current Hosted authority shape without any
          -- customer data: anon has no table access; authenticated inherited
          -- broad table privileges; service_role has sequence usage.
          revoke all privileges on table public.rc_customer_accounts from anon;
          grant all privileges on table public.rc_customer_accounts to authenticated;
          revoke all privileges on sequence public.rc_customer_number_seq
            from public, anon, authenticated;
          grant usage on sequence public.rc_customer_number_seq to service_role;
          SQL

      - name: Start isolated Supabase stack
        run: supabase start

      - name: Prove fixture matches verified unsafe authority precondition
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if not has_table_privilege('authenticated', 'public.rc_customer_accounts', 'INSERT')
               or not has_table_privilege('authenticated', 'public.rc_customer_accounts', 'UPDATE')
               or not has_table_privilege('authenticated', 'public.rc_customer_accounts', 'DELETE')
               or not has_table_privilege('authenticated', 'public.rc_customer_accounts', 'TRUNCATE') then
              raise exception 'fixture must reproduce broad authenticated control-plane privileges';
            end if;

            if has_table_privilege('anon', 'public.rc_customer_accounts', 'SELECT')
               or has_table_privilege('anon', 'public.rc_customer_accounts', 'INSERT')
               or has_table_privilege('anon', 'public.rc_customer_accounts', 'UPDATE')
               or has_table_privilege('anon', 'public.rc_customer_accounts', 'DELETE') then
              raise exception 'fixture must reproduce current anon no-table-privilege state';
            end if;

            if to_regprocedure('public.ensure_rc_customer_account(uuid)') is not null then
              raise exception 'fixture must begin without allocator function';
            end if;
          end;
          $$;
          SQL

      - name: Apply remediation candidate to disposable stack only
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 \
            -f scripts/supabase-customer-account-remediation-candidate.sql

      - name: Prove least-privilege ACL and allocator boundary
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_rls_enabled boolean;
            v_security_definer boolean;
            v_proconfig text[];
            v_policy_count integer;
          begin
            select c.relrowsecurity
            into v_rls_enabled
            from pg_class c
            join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public'
              and c.relname = 'rc_customer_accounts';

            if v_rls_enabled is distinct from true then
              raise exception 'rc_customer_accounts RLS must remain enabled';
            end if;

            if has_table_privilege('anon', 'public.rc_customer_accounts', 'SELECT')
               or has_table_privilege('anon', 'public.rc_customer_accounts', 'INSERT')
               or has_table_privilege('anon', 'public.rc_customer_accounts', 'UPDATE')
               or has_table_privilege('anon', 'public.rc_customer_accounts', 'DELETE')
               or has_table_privilege('anon', 'public.rc_customer_accounts', 'TRUNCATE')
               or has_table_privilege('anon', 'public.rc_customer_accounts', 'REFERENCES')
               or has_table_privilege('anon', 'public.rc_customer_accounts', 'TRIGGER') then
              raise exception 'anon must have no direct customer-account table privilege';
            end if;

            if not has_table_privilege('authenticated', 'public.rc_customer_accounts', 'SELECT') then
              raise exception 'authenticated must retain owner-scoped SELECT';
            end if;

            if has_table_privilege('authenticated', 'public.rc_customer_accounts', 'INSERT')
               or has_table_privilege('authenticated', 'public.rc_customer_accounts', 'UPDATE')
               or has_table_privilege('authenticated', 'public.rc_customer_accounts', 'DELETE')
               or has_table_privilege('authenticated', 'public.rc_customer_accounts', 'TRUNCATE')
               or has_table_privilege('authenticated', 'public.rc_customer_accounts', 'REFERENCES')
               or has_table_privilege('authenticated', 'public.rc_customer_accounts', 'TRIGGER') then
              raise exception 'authenticated direct customer-account mutation/control privilege must be revoked';
            end if;

            if has_sequence_privilege('anon', 'public.rc_customer_number_seq', 'USAGE')
               or has_sequence_privilege('anon', 'public.rc_customer_number_seq', 'SELECT')
               or has_sequence_privilege('anon', 'public.rc_customer_number_seq', 'UPDATE')
               or has_sequence_privilege('authenticated', 'public.rc_customer_number_seq', 'USAGE')
               or has_sequence_privilege('authenticated', 'public.rc_customer_number_seq', 'SELECT')
               or has_sequence_privilege('authenticated', 'public.rc_customer_number_seq', 'UPDATE') then
              raise exception 'client roles must not access customer-number sequence';
            end if;

            select count(*)::integer
            into v_policy_count
            from pg_policies
            where schemaname = 'public'
              and tablename = 'rc_customer_accounts'
              and policyname = 'rc_customer_accounts_read_own'
              and cmd = 'SELECT';

            if v_policy_count <> 1 then
              raise exception 'owner-read RLS policy must be preserved';
            end if;

            if not has_function_privilege(
              'service_role',
              'public.ensure_rc_customer_account(uuid)',
              'EXECUTE'
            ) then
              raise exception 'service_role must execute trusted allocator';
            end if;

            if has_function_privilege(
              'anon',
              'public.ensure_rc_customer_account(uuid)',
              'EXECUTE'
            ) or has_function_privilege(
              'authenticated',
              'public.ensure_rc_customer_account(uuid)',
              'EXECUTE'
            ) then
              raise exception 'client roles must not execute trusted allocator';
            end if;

            if exists (
              select 1
              from information_schema.routine_privileges
              where specific_schema = 'public'
                and routine_name = 'ensure_rc_customer_account'
                and grantee = 'PUBLIC'
                and privilege_type = 'EXECUTE'
            ) then
              raise exception 'PUBLIC must not execute trusted allocator';
            end if;

            select p.prosecdef, p.proconfig
            into v_security_definer, v_proconfig
            from pg_proc p
            join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public'
              and p.oid = 'public.ensure_rc_customer_account(uuid)'::regprocedure;

            if v_security_definer is distinct from true then
              raise exception 'trusted allocator must be SECURITY DEFINER';
            end if;

            if v_proconfig is null
               or not ('search_path=pg_catalog, public, pg_temp' = any(v_proconfig)) then
              raise exception 'trusted allocator must pin a safe search_path';
            end if;
          end;
          $$;
          SQL

      - name: Prove concurrent idempotent allocation and cross-tenant negatives
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"

          USER_A_JSON="$(curl -fsS -X POST "$API_URL/auth/v1/admin/users" \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"email":"rc-authority-a@example.test","password":"LocalOnly-Aa1!","email_confirm":true}')"
          USER_B_JSON="$(curl -fsS -X POST "$API_URL/auth/v1/admin/users" \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"email":"rc-authority-b@example.test","password":"LocalOnly-Bb2!","email_confirm":true}')"

          USER_A="$(printf '%s' "$USER_A_JSON" | jq -r '.id // empty')"
          USER_B="$(printf '%s' "$USER_B_JSON" | jq -r '.id // empty')"
          test -n "$USER_A"
          test -n "$USER_B"

          psql "$DB_URL" -v ON_ERROR_STOP=1 -qAtc \
            "set role service_role; select (public.ensure_rc_customer_account('$USER_A'::uuid)).customer_sequence;" \
            > /tmp/rc-a1.txt &
          PID_A1=$!
          psql "$DB_URL" -v ON_ERROR_STOP=1 -qAtc \
            "set role service_role; select (public.ensure_rc_customer_account('$USER_A'::uuid)).customer_sequence;" \
            > /tmp/rc-a2.txt &
          PID_A2=$!
          wait "$PID_A1"
          wait "$PID_A2"

          A1="$(tr -d '[:space:]' < /tmp/rc-a1.txt)"
          A2="$(tr -d '[:space:]' < /tmp/rc-a2.txt)"
          test "$A1" = "357071"
          test "$A2" = "357071"

          B1="$(psql "$DB_URL" -v ON_ERROR_STOP=1 -qAtc \
            "set role service_role; select (public.ensure_rc_customer_account('$USER_B'::uuid)).customer_sequence;" \
            | tr -d '[:space:]')"
          test "$B1" = "357072"

          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_count integer;
            v_min bigint;
            v_max bigint;
            v_last bigint;
            v_called boolean;
          begin
            select count(*)::integer, min(customer_sequence), max(customer_sequence)
            into v_count, v_min, v_max
            from public.rc_customer_accounts;

            if v_count <> 2 or v_min <> 357071 or v_max <> 357072 then
              raise exception 'allocator must create exactly two fixture identities with no same-owner duplicate';
            end if;

            select last_value, is_called
            into v_last, v_called
            from public.rc_customer_number_seq;

            if v_last <> 357072 or v_called is distinct from true then
              raise exception 'same-owner concurrent retry must not burn an extra sequence value';
            end if;
          end;
          $$;
          SQL

          COUNT_A="$(psql "$DB_URL" -v ON_ERROR_STOP=1 -qAtc \
            "begin; set local role authenticated; set local request.jwt.claim.sub = '$USER_A'; select count(*) from public.rc_customer_accounts; rollback;" \
            | tr -d '[:space:]')"
          test "$COUNT_A" = "1"

          if psql "$DB_URL" -v ON_ERROR_STOP=1 -qAtc \
            "begin; set local role authenticated; set local request.jwt.claim.sub = '$USER_A'; update public.rc_customer_accounts set updated_at = now() where owner_id = '$USER_A'::uuid; rollback;"; then
            echo "::error::authenticated UPDATE unexpectedly succeeded"
            exit 1
          fi

          if psql "$DB_URL" -v ON_ERROR_STOP=1 -qAtc \
            "begin; set local role authenticated; set local request.jwt.claim.sub = '$USER_A'; delete from public.rc_customer_accounts where owner_id = '$USER_A'::uuid; rollback;"; then
            echo "::error::authenticated DELETE unexpectedly succeeded"
            exit 1
          fi

          if psql "$DB_URL" -v ON_ERROR_STOP=1 -qAtc \
            "begin; set local role authenticated; set local request.jwt.claim.sub = '$USER_A'; select (public.ensure_rc_customer_account('$USER_A'::uuid)).owner_id; rollback;"; then
            echo "::error::authenticated allocator execution unexpectedly succeeded"
            exit 1
          fi

      - name: Stop isolated Supabase stack
        if: always()
        run: supabase stop --no-backup
